$kind: http-request
url: "{{baseUrl}}/api/v1/inventory/stock?q=loc gio wave"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Có Lọc gió Wave Alpha', () => pm.expect(b.items.map(i => i.partName)).to.include('Lọc gió Wave Alpha'));
    language: text/javascript
order: 5000
