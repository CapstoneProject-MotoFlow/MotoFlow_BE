$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "countType": "OPENING",
      "countDate": "{{today}}",
      "scopeType": "WHOLE"
    }
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('Mã lỗi MSG244', () => pm.expect(pm.response.json().code).to.eql('MSG244'));
    language: text/javascript
order: 1000
