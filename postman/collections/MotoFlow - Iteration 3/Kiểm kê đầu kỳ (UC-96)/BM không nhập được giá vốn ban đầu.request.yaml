$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts/999999999/opening-costs"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "costs": [
        { "productId": 1, "initialUnitCost": 1000 }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
