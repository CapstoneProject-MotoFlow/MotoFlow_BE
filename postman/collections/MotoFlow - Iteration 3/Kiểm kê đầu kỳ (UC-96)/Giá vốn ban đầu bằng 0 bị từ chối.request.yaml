$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts/999999999/opening-costs"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "costs": [
        { "productId": 1, "initialUnitCost": 0 }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG02', () => pm.expect(pm.response.json().code).to.eql('MSG02'));
    language: text/javascript
order: 3000
