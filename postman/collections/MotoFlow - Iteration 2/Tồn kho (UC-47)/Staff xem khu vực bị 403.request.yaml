$kind: http-request
url: "{{baseUrl}}/api/v1/inventory/stock/storage-areas"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
