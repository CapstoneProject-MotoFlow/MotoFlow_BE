$kind: http-request
url: "{{baseUrl}}/api/v1/inventory/stock/summary"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Có đủ 4 số', () => pm.expect(b).to.have.all.keys('withStock', 'lowStock', 'unavailable', 'expiryAlert'));
      pm.test('Số không âm', () => Object.values(b).forEach(n => pm.expect(n).to.be.at.least(0)));
    language: text/javascript
order: 1000
