$kind: http-request
url: "{{baseUrl}}/api/v1/products/barcode/8936012340011"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Đúng phụ tùng', () => pm.expect(b.sku).to.eql('BUG-NGK-CPR8'));
      pm.test('Tồn của kho mình', () => {
          pm.expect(b.storeId).to.eql(Number(pm.collectionVariables.get('bmStoreId')));
          pm.expect(b.availableQty).to.be.a('number');
      });
      pm.test('Không có giá', () => pm.expect(b).to.not.have.any.keys('retailPrice', 'movingAvgCost'));
    language: text/javascript
order: 1000
