$kind: http-request
url: "{{baseUrl}}/api/v1/replenishment-requests/drafts/{{draftId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "note": "Nháp đã sửa",
      "lines": [
        { "productId": {{partId}}, "requestedQty": 4 },
        { "productId": {{secondPartId}}, "requestedQty": 1 }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{branchBmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Thay toàn bộ nội dung', () => {
          pm.expect(b.note).to.eql('Nháp đã sửa');
          pm.expect(b.lines.length).to.eql(2);
          pm.expect(b.status).to.eql('DRAFT');
      });
    language: text/javascript
order: 16000
