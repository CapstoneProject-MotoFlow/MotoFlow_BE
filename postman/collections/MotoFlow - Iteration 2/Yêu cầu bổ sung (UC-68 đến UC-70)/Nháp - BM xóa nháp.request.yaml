$kind: http-request
url: "{{baseUrl}}/api/v1/replenishment-requests/drafts/{{draftToDeleteId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{branchBmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 19000
