$kind: http-request
url: "{{baseUrl}}/api/v1/replenishment-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lines": [
        { "productId": {{partId}}, "requestedQty": 1 },
        { "productId": {{partId}}, "requestedQty": 2 }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{branchBmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG93', () => pm.expect(pm.response.json().code).to.eql('MSG93'));
    language: text/javascript
order: 4000
