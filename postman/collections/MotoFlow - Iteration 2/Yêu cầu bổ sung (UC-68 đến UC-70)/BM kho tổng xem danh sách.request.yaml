$kind: http-request
url: "{{baseUrl}}/api/v1/replenishment-requests?size=100"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const items = pm.response.json().items;
      pm.test('Thấy yêu cầu của nhiều cửa hàng', () =>
          pm.expect(new Set(items.map(row => row.requestingStoreId)).size).to.be.above(1));
      pm.test('Yêu cầu chờ điều phối đứng trước', () => {
          const waiting = items.map(row => row.status === 'AWAITING_COORDINATION');
          pm.expect(waiting.lastIndexOf(true)).to.be.below(waiting.indexOf(false) === -1 ? items.length : waiting.indexOf(false));
      });
    language: text/javascript
order: 8000
