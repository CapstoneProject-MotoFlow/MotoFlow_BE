$kind: http-request
url: "{{baseUrl}}/api/v1/inventory/lots?tab=DEPLETED"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Các lô đều còn lại 0', () => pm.response.json().page.items.forEach(row =>
          pm.expect(row.remainingQty).to.eql(0)));
    language: text/javascript
order: 3000
