$kind: http-request
url: "{{baseUrl}}/api/v1/inventory/lots/{{lotId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      const bmStore = Number(pm.collectionVariables.get('bmStoreId'));
      pm.test('byStore có kho của Branch Manager', () => pm.expect(b.byStore.map(s => s.storeId)).to.include(bmStore));
      pm.test('Mọi kho trong byStore còn giữ lô', () => b.byStore.forEach(s =>
          pm.expect(s.availableQty + s.otherQty + s.inTransitQty).to.be.above(0)));
      pm.test('Sắp theo tên kho', () => {
          const names = b.byStore.map(s => s.storeName);
          pm.expect(names).to.eql([...names].sort());
      });
    language: text/javascript
order: 6200
