$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts/{{stockCountId}}/lines"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lines": [{ "lineId": {{firstLineId}}, "countedQty": -1 }]
    }
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã MSG237', () => pm.expect(pm.response.json().code).to.eql('MSG237'));
    language: text/javascript
order: 15000
