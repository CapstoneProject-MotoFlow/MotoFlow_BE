$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts/{{stockCountId}}/approve"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "decisionReason": "Đồng ý điều chỉnh"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Phiếu COMPLETED', () => pm.expect(b.status).to.eql('COMPLETED'));
      pm.test('Có người duyệt', () => pm.expect(b.approvedBy).to.be.a('number'));
    language: text/javascript
order: 24000
