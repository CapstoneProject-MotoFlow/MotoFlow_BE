$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const items = pm.response.json().counts.items;
      pm.test('Có phiếu vừa duyệt', () =>
          pm.expect(items.map(c => c.id)).to.include(Number(pm.collectionVariables.get('stockCountId'))));
    language: text/javascript
order: 26000
