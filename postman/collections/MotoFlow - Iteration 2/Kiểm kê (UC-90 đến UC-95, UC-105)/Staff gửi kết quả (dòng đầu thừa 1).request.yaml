$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts/{{stockCountId}}/submit"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lines": {{submitLines}}
    }
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Phiếu vẫn COUNTING chờ BM xác nhận', () => pm.expect(b.status).to.eql('COUNTING'));
      pm.test('Mọi dòng đã đếm', () => b.lines.forEach(l => pm.expect(l.countedQty).to.be.a('number')));
    language: text/javascript
order: 16000
