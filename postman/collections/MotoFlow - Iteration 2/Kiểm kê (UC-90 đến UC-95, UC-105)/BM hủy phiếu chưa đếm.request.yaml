$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts/{{cancelCountId}}/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Tạo nhầm"
    }
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Phiếu CANCELLED', () => pm.expect(pm.response.json().status).to.eql('CANCELLED'));
    language: text/javascript
order: 28000
