$kind: http-request
url: "{{baseUrl}}/api/v1/stock-count-requests/{{cancelRequestId}}/cancel"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Yêu cầu CANCELLED', () => pm.expect(pm.response.json().status).to.eql('CANCELLED'));
    language: text/javascript
order: 30000
