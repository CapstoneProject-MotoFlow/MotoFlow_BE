$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts/{{cancelCountId}}/start"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: beforeRequest
    code: |-
      if (pm.collectionVariables.get('plannedCountDate') === pm.collectionVariables.get('countToday')) {
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('Mã MSG247', () => pm.expect(pm.response.json().code).to.eql('MSG247'));
      const [y, m, d] = pm.collectionVariables.get('plannedCountDate').split('-');
      pm.test('Báo ngày kiểm dd/MM/yyyy', () => pm.expect(pm.response.json().message).to.include(`${d}/${m}/${y}`));
    language: text/javascript
order: 27200
