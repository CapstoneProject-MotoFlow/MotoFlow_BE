$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts/{{stockCountId}}/start"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const line = pm.response.json().lines.find(l => l.id === Number(pm.collectionVariables.get('firstLineId')));
      pm.test('Dòng đầu cần đếm lại', () => pm.expect(line.recountRequested).to.be.true);
      pm.test('Số đếm cũ đã được xóa', () => pm.expect(line.countedQty == null).to.be.true);
    language: text/javascript
order: 20000
