$kind: http-request
url: "{{baseUrl}}/api/v1/warehouse-tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "taskType": "COUNTING",
      "documentId": {{stockCountId}},
      "assigneeId": {{staffUserId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 11000
