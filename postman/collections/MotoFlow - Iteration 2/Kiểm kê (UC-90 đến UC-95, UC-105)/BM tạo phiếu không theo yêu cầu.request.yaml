$kind: http-request
url: "{{baseUrl}}/api/v1/stock-counts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "countType": "CYCLE",
      "countDate": "{{plannedCountDate}}",
      "scopeType": "PRODUCTS",
      "productIds": [{{countPartId}}]
    }
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // A planned count dated tomorrow in Vietnam time (UTC+7), so starting it early shows MSG247.
      // On the last day of the month tomorrow is in the next period: today is used and the MSG247 requests are skipped.
      const vnNow = new Date(Date.now() + 7 * 3600 * 1000);
      const today = vnNow.toISOString().slice(0, 10);
      const tomorrow = new Date(vnNow.getTime() + 24 * 3600 * 1000).toISOString().slice(0, 10);
      pm.collectionVariables.set('countToday', today);
      pm.collectionVariables.set('plannedCountDate', tomorrow.slice(0, 7) === today.slice(0, 7) ? tomorrow : today);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('cancelCountId', pm.response.json().id);
    language: text/javascript
order: 27000
