$kind: http-request
url: "{{baseUrl}}/api/v1/inventory/past-date-stock?date={{yesterday}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Vietnam time (UTC+7), as yyyy-MM-dd; later requests of this folder reuse the variables.
      const vn = ms => new Date(Date.now() + 7 * 3600 * 1000 + ms).toISOString().slice(0, 10);
      pm.collectionVariables.set('today', vn(0));
      pm.collectionVariables.set('yesterday', vn(-24 * 3600 * 1000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Đúng kho của Branch Manager', () =>
          pm.expect(b.storeId).to.eql(Number(pm.collectionVariables.get('bmStoreId'))));
      pm.test('Đúng ngày đã hỏi', () => pm.expect(b.date).to.eql(pm.collectionVariables.get('yesterday')));
      pm.test('Có khóa basedOnPeriod', () => pm.expect(b).to.have.property('basedOnPeriod'));
      pm.test('Tồn cuối ngày là số, không âm và mặc định bỏ dòng bằng 0', () => b.page.items.forEach(row => {
          pm.expect(row.closingQty).to.be.a('number');
          pm.expect(row.closingQty).to.be.above(0);
      }));
      pm.test('Xếp theo SKU', () => {
          const skus = b.page.items.map(row => row.sku);
          pm.expect(skus).to.eql([...skus].sort());
      });
    language: text/javascript
order: 1000
