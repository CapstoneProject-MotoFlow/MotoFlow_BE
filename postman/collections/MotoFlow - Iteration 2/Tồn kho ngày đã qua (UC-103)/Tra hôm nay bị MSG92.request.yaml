$kind: http-request
url: "{{baseUrl}}/api/v1/inventory/past-date-stock?date={{today}}&storeId={{bmStoreId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG92', () => pm.expect(pm.response.json().code).to.eql('MSG92'));
    language: text/javascript
order: 4000
