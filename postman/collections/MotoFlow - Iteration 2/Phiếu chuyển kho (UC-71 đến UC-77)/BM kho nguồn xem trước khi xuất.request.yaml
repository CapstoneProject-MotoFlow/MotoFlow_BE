$kind: http-request
url: "{{baseUrl}}/api/v1/transfer-orders/{{transferId}}/dispatch-preview"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Đã sẵn sàng và được xác nhận', () => pm.expect(b.canConfirm).to.eql(true));
      pm.test('Có lô sẽ lấy', () => b.lines.forEach(line => pm.expect(line.lots.length).to.be.above(0)));
    language: text/javascript
order: 10000
