$kind: http-request
url: "{{baseUrl}}/api/v1/transfer-orders/{{transferId}}/prepared-lines"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lines": [
        { "productId": {{shortPartId}}, "preparedQty": 2 },
        { "productId": {{excessPartId}}, "preparedQty": 2 }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
