$kind: http-request
url: "{{baseUrl}}/api/v1/transfer-orders/{{transferId}}/dispatch"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lines": [
        { "productId": {{shortPartId}}, "dispatchedQty": 2 },
        { "productId": {{excessPartId}}, "dispatchedQty": 2 }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 9000
