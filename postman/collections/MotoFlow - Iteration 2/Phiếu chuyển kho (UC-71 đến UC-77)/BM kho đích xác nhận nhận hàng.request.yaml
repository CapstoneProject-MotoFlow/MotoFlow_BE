$kind: http-request
url: "{{baseUrl}}/api/v1/transfer-orders/{{transferId}}/receipts/{{receiptId}}/confirm"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{branchBmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Phiếu nhận đã xác nhận', () => pm.expect(pm.response.json().status).to.eql('CONFIRMED'));
    language: text/javascript
order: 15000
