$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{destStaffUsername}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.collectionVariables.set('destStaffToken', b.accessToken);
      pm.collectionVariables.set('destStaffId', b.user.id);
      pm.test('Cùng cửa hàng với bm.cg', () =>
          pm.expect(b.user.storeId).to.eql(Number(pm.collectionVariables.get('branchStoreId'))));
    language: text/javascript
order: 2000
