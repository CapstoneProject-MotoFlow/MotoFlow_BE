$kind: http-request
url: "{{baseUrl}}/api/v1/transfer-orders/{{transferId}}/closing-preview"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Không còn gì chặn', () => {
          pm.expect(b.canClose).to.eql(true);
          pm.expect(b.blockedBy).to.eql([]);
      });
    language: text/javascript
order: 24000
