$kind: http-request
url: "{{baseUrl}}/api/v1/transfer-orders/{{transferId}}/close"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('Mã lỗi MSG221', () => pm.expect(pm.response.json().code).to.eql('MSG221'));
    language: text/javascript
order: 16000
