$kind: http-request
url: "{{baseUrl}}/api/v1/transfer-orders/{{transferId}}/dispatch"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lines": [
        { "productId": {{shortPartId}}, "dispatchedQty": 2 },
        { "productId": {{excessPartId}}, "dispatchedQty": 2 }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bmToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Đang vận chuyển', () => pm.expect(pm.response.json().status).to.eql('IN_TRANSIT'));
    language: text/javascript
order: 11000
