$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "khongco.{{run}}",
      "password": "Sai12345"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('Mã lỗi MSG09', () => pm.expect(pm.response.json().code).to.eql('MSG09'));
    language: text/javascript
order: 2000
