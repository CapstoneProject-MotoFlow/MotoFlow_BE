$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Đúng Admin', () => pm.expect(pm.response.json().role).to.eql('ADMIN'));
    language: text/javascript
order: 4000
