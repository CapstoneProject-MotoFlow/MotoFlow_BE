$kind: http-request
url: "{{baseUrl}}/api/vehicle-models"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "manufacturer": "Honda",
      "modelName": "Vision {{run}}",
      "vehicleType": "MOTORCYCLE",
      "yearFrom": 2024,
      "yearTo": 2020
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG64', () => pm.expect(pm.response.json().code).to.eql('MSG64'));
    language: text/javascript
order: 3000
