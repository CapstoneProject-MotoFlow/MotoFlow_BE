$kind: http-request
url: "{{baseUrl}}/api/v1/products?categoryId={{catParentId}}"
method: GET
queryParams:
  categoryId: "{{catParentId}}"
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test("Chỉ phụ tùng của nhóm phanh", () => pm.expect(pm.response.json().totalItems).to.eql(1));
    language: text/javascript
order: 13000
