$kind: http-request
url: "{{baseUrl}}/api/v1/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sku": "bt-{{run}}-02",
      "partName": "Bố thắng đĩa trước {{run}}",
      "categoryId": {{catChainId}},
      "brand": "Nissin",
      "countryOfOrigin": "Thái Lan",
      "baseUnit": "Bộ",
      "specifications": "Dùng cho phanh đĩa trước"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG55', () => pm.expect(pm.response.json().code).to.eql('MSG55'));
    language: text/javascript
order: 5000
