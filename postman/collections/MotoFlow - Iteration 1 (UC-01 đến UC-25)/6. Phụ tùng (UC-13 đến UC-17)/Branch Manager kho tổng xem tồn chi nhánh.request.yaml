$kind: http-request
url: "{{baseUrl}}/api/v1/products?q={{run}}&storeId={{branchStoreId}}"
method: GET
queryParams:
  q: "{{run}}"
  storeId: "{{branchStoreId}}"
auth:
  type: bearer
  credentials:
    token: "{{bmcToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test("Có số tồn", () => pm.expect(pm.response.json().items[0].availableQty).to.eql(0));
    language: text/javascript
order: 19000
