$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}?storeId={{branchStoreId}}"
method: GET
queryParams:
  storeId: "{{branchStoreId}}"
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Tồn của chi nhánh', () => pm.expect(pm.response.json().stock.storeId).to.eql(Number(pm.collectionVariables.get('branchStoreId'))));
    language: text/javascript
order: 20000
