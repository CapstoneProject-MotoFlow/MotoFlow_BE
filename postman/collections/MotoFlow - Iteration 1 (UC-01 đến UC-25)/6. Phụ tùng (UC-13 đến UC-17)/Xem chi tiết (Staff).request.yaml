$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Tồn kho của chi nhánh Staff, có dòng xe', () => {
          pm.expect(b.stock.storeId).to.eql(Number(pm.collectionVariables.get('branchStoreId')));
          pm.expect(b.stock.availableQty).to.eql(0);
          pm.expect(b.vehicleModels.length).to.eql(1);
      });
    language: text/javascript
order: 17000
