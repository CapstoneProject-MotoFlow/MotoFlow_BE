$kind: http-request
url: "{{baseUrl}}/api/products?q={{run}}&size=1&page=1"
method: GET
queryParams:
  q: "{{run}}"
  size: "1"
  page: "1"
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const page = pm.response.json();
      pm.test("Tổng 2 phụ tùng", () => pm.expect(page.totalItems).to.eql(2));
      pm.test('Trang 2 là phụ tùng nhông xích', () => pm.expect(page.items.map(p => p.id)).to.eql([Number(pm.collectionVariables.get('product2Id'))]));
    language: text/javascript
order: 15000
