$kind: http-request
url: "{{baseUrl}}/api/v1/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Hết mật khẩu tạm', () => pm.expect(pm.response.json().mustChangePassword).to.eql(false));
    language: text/javascript
order: 6000
