$kind: http-request
url: "{{baseUrl}}/api/accounts"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      pm.test('Mã lỗi MSG05', () => pm.expect(pm.response.json().code).to.eql('MSG05'));
    language: text/javascript
order: 14000
