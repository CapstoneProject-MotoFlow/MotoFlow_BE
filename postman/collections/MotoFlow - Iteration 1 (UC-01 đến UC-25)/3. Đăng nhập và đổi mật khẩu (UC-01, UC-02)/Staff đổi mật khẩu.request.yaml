$kind: http-request
url: "{{baseUrl}}/api/v1/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{staffTemp}}",
      "newPassword": "{{password}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 12000
