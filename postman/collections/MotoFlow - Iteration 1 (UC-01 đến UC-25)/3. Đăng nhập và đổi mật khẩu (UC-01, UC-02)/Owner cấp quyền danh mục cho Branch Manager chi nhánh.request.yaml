$kind: http-request
url: "{{baseUrl}}/api/v1/branch-managers/{{bmId}}/permissions"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "catalogEdit": true,
      "retailPriceEdit": false,
      "reason": "Phụ trách danh mục"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Có quyền danh mục', () => pm.expect(pm.response.json().catalogEdit).to.eql(true));
    language: text/javascript
order: 6500
