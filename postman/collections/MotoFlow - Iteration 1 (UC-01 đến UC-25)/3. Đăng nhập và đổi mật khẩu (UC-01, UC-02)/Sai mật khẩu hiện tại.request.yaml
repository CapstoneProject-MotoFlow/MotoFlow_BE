$kind: http-request
url: "{{baseUrl}}/api/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "Sai12345",
      "newPassword": "{{password}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG42', () => pm.expect(pm.response.json().code).to.eql('MSG42'));
    language: text/javascript
order: 4000
