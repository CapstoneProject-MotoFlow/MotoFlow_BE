$kind: http-request
url: "{{baseUrl}}/api/part-categories/{{catChainId}}/deactivate"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 11000
