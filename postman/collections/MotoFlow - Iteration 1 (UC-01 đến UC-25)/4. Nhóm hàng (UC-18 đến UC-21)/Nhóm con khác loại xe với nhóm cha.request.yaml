$kind: http-request
url: "{{baseUrl}}/api/part-categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Phanh xe đạp {{run}}",
      "vehicleType": "BICYCLE",
      "parentId": {{catParentId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG59', () => pm.expect(pm.response.json().code).to.eql('MSG59'));
    language: text/javascript
order: 4000
