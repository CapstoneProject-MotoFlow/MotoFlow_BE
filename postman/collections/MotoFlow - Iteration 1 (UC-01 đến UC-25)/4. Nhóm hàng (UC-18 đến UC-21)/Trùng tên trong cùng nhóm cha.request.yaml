$kind: http-request
url: "{{baseUrl}}/api/v1/part-categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Phanh đĩa {{run}}",
      "vehicleType": "MOTORCYCLE",
      "parentId": {{catParentId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('Mã lỗi MSG58', () => pm.expect(pm.response.json().code).to.eql('MSG58'));
    language: text/javascript
order: 3000
