$kind: http-request
url: "{{baseUrl}}/api/v1/part-categories/{{catParentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Phanh {{run}}",
      "vehicleType": "MOTORCYCLE",
      "parentId": {{catLeafId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG59', () => pm.expect(pm.response.json().code).to.eql('MSG59'));
    language: text/javascript
order: 10000
