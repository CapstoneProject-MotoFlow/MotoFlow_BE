$kind: http-request
url: "{{baseUrl}}/api/part-categories/999999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Không có",
      "vehicleType": "MOTORCYCLE"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('Mã lỗi MSG61', () => pm.expect(pm.response.json().code).to.eql('MSG61'));
    language: text/javascript
order: 12000
