$kind: http-request
url: "{{baseUrl}}/api/v1/accounts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "staff.{{run}}",
      "fullName": "Test staff.{{run}}",
      "role": "STAFF",
      "storeId": {{branchStoreId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('Mã lỗi MSG45', () => pm.expect(pm.response.json().code).to.eql('MSG45'));
    language: text/javascript
order: 7000
