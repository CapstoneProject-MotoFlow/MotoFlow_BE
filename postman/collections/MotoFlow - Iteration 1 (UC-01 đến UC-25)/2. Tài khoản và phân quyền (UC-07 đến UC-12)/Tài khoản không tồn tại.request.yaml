$kind: http-request
url: "{{baseUrl}}/api/v1/accounts/999999999/lock"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('Mã lỗi MSG48', () => pm.expect(pm.response.json().code).to.eql('MSG48'));
    language: text/javascript
order: 20000
