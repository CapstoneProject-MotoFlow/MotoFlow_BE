$kind: http-request
url: "{{baseUrl}}/api/v1/accounts/{{adminId}}/reset-password"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG47', () => pm.expect(pm.response.json().code).to.eql('MSG47'));
    language: text/javascript
order: 19000
