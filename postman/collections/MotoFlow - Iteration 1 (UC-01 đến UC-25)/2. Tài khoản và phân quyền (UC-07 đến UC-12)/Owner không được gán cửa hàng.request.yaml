$kind: http-request
url: "{{baseUrl}}/api/accounts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "owner2.{{run}}",
      "fullName": "Test owner2.{{run}}",
      "role": "OWNER",
      "storeId": {{branchStoreId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG16', () => pm.expect(pm.response.json().code).to.eql('MSG16'));
    language: text/javascript
order: 2000
