$kind: http-request
url: "{{baseUrl}}/api/v1/accounts/{{bmId}}/permissions"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "BRANCH_MANAGER",
      "storeId": {{branchStoreId}},
      "catalogEdit": true,
      "reason": "Phụ trách danh mục"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('catalogEdit bị bỏ qua, chưa có CATALOG_EDIT', () => pm.expect(pm.response.json().permissions).to.not.include('CATALOG_EDIT'));
    language: text/javascript
order: 11000
