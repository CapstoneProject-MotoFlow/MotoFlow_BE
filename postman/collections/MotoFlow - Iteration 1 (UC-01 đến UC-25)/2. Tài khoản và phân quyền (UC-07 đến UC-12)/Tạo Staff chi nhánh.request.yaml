$kind: http-request
url: "{{baseUrl}}/api/accounts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "staff.{{run}}",
      "fullName": "Test staff.{{run}}",
      "role": "STAFF",
      "storeId": {{branchStoreId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      const b = pm.response.json();
      pm.collectionVariables.set('staffId', b.account.id);
      pm.collectionVariables.set('staffTemp', b.temporaryPassword);
      pm.test('Hệ thống sinh mật khẩu tạm 12 ký tự, phải đổi khi đăng nhập', () => {
          pm.expect(b.temporaryPassword).to.match(/^[A-Za-z0-9!@#$%&*?]{12}$/);
          pm.expect(b.account.mustChangePassword).to.eql(true);
      });
      pm.test('Trả về tên cửa hàng', () => pm.expect(b.account.storeName).to.eql('Chi nhánh ' + pm.collectionVariables.get('run')));
    language: text/javascript
order: 5000
