$kind: http-request
url: "{{baseUrl}}/api/v1/accounts/{{bmId}}/permission-history"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Có lần tạo và lần cấp quyền', () => pm.expect(pm.response.json().length).to.be.at.least(2));
    language: text/javascript
order: 14000
