$kind: http-request
url: "{{baseUrl}}/api/v1/accounts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "staff2.{{run}}",
      "fullName": "Test staff2.{{run}}",
      "role": "STAFF"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG16', () => pm.expect(pm.response.json().code).to.eql('MSG16'));
    language: text/javascript
order: 6000
