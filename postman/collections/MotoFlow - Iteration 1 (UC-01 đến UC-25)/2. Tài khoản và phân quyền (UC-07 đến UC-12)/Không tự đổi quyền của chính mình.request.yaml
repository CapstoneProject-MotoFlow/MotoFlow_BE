$kind: http-request
url: "{{baseUrl}}/api/accounts/{{adminId}}/permissions"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "ADMIN",
      "catalogEdit": false
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG15', () => pm.expect(pm.response.json().code).to.eql('MSG15'));
    language: text/javascript
order: 13000
