$kind: http-request
url: "{{baseUrl}}/api/stores/999999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "storeName": "Chi nhánh {{run}}",
      "address": "Đà Nẵng",
      "phone": "",
      "status": "ACTIVE",
      "warehouseName": "Kho chi nhánh {{run}}",
      "central": false
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('Mã lỗi MSG52', () => pm.expect(pm.response.json().code).to.eql('MSG52'));
    language: text/javascript
order: 13000
