$kind: http-request
url: "{{baseUrl}}/api/v1/stores?status=OPEN"
method: GET
queryParams:
  status: OPEN
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG02', () => pm.expect(pm.response.json().code).to.eql('MSG02'));
    language: text/javascript
order: 12000
