$kind: http-request
url: "{{baseUrl}}/api/v1/accounts/{{staffId}}/lock"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Đóng chi nhánh"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 3000
