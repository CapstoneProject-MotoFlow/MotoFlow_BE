$kind: http-request
url: "{{baseUrl}}/api/accounts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "staff4.{{run}}",
      "fullName": "Test staff4.{{run}}",
      "role": "STAFF",
      "storeId": {{branchStoreId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi MSG46', () => pm.expect(pm.response.json().code).to.eql('MSG46'));
    language: text/javascript
order: 5000
