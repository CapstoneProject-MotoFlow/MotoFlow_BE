spring.application.name=MotorFlow
# Local runs use the dev profile; servers must set SPRING_PROFILES_ACTIVE explicitly.
spring.profiles.default=dev

# Database (override with environment variables on a server)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/motoflow}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Health check for deploys and monitoring: only GET /actuator/health is exposed. It answers
# {"status":"UP"} or 503 {"status":"DOWN"}, with no details, and is DOWN when PostgreSQL is unreachable.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

# Accounts come from the database, not from Spring Boot's generated in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Authentication (UC-01, SEC-02)
motoflow.auth.jwt-secret=${MOTOFLOW_JWT_SECRET:mySecretKey123mySecretKey123mySecretKey123mySecretKey123mySecretKey123}
motoflow.auth.issuer=motoflow
motoflow.auth.access-token-ttl=15m
motoflow.auth.refresh-token-ttl=7d
motoflow.auth.max-failed-attempts=5
motoflow.auth.lock-duration=10m
motoflow.auth.refresh-cookie.name=mf_refresh
motoflow.auth.refresh-cookie.path=/api/auth
motoflow.auth.refresh-cookie.secure=true
motoflow.auth.refresh-cookie.same-site=Lax

# Frontend origins allowed to call the API with credentials (comma separated)
motoflow.cors.allowed-origins=${MOTOFLOW_CORS_ORIGINS:http://localhost:5173}

# First Admin account, created only when the database has no Admin (see BootstrapAdminInitializer)
motoflow.bootstrap.admin.username=${MOTOFLOW_ADMIN_USERNAME:admin}
motoflow.bootstrap.admin.password=${MOTOFLOW_ADMIN_PASSWORD:admin}